<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pesquisa</title>

<style>

/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* TELA */
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, Arial;
}

/* FUNDO */
body {
  background: url("fundo.png") no-repeat center center fixed;
  background-size: cover;
}

/* OVERLAY SUAVE */
.overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle, rgba(0,0,0,0.2), rgba(0,0,0,0.5));
  z-index: 1;
}

/* CARD VIDRO */
.container {
  position: absolute;
  right: 5%;
  top: 50%;
  transform: translateY(-50%);
  z-index: 2;

  width: 90%;
  max-width: 420px;
  padding: 30px;

  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(15px);
  border-radius: 20px;

  box-shadow: 0 10px 40px rgba(0,0,0,0.5);

  text-align: center;

  animation: fadeIn 1s ease;
}

/* ANIMAÇÃO */
@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(40%) scale(0.95);
  }
  to {
    opacity: 1;
    transform: translateY(-50%) scale(1);
  }
}

/* TEXTO */
h1 {
  font-size: 26px;
  margin-bottom: 30px;
  color: white;
}

/* BOTÕES */
.btn {
  padding: 18px;
  margin: 10px 0;
  font-size: 16px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  width: 100%;
  transition: 0.3s;
  font-weight: bold;
}

/* VERDE PREMIUM */
.sim {
  background: linear-gradient(135deg, #00c853, #00e676);
  box-shadow: 0 5px 20px rgba(0,200,83,0.5);
}

/* VERMELHO PREMIUM */
.nao {
  background: linear-gradient(135deg, #d50000, #ff1744);
  box-shadow: 0 5px 20px rgba(213,0,0,0.5);
}

/* HOVER */
.btn:hover {
  transform: scale(1.05);
  filter: brightness(1.1);
}

/* CLICK */
.btn:active {
  transform: scale(0.95);
}

/* ESCONDER */
.hidden {
  display: none;
}

/* TEXTO OBRIGADO */
#tela-obrigado h1 {
  font-size: 28px;
  color: #00e676;
}

</style>
</head>

<body>

<div class="overlay"></div>

<div class="container">

  <div id="tela-pergunta">
    <h1>Você gostaria dessa experiência no seu atendimento?</h1>

    <button class="btn sim" onclick="responder('Sim')">
      Quero essa experiência
    </button>

    <button class="btn nao" onclick="responder('Não')">
      Prefiro como está
    </button>
  </div>

  <div id="tela-obrigado" class="hidden">
    <h1>Resposta enviada ✔</h1>
  </div>

</div>

<script>
function responder(valor) {

  fetch("https://script.google.com/macros/s/AKfycbzv3pRzGk9iWGCZ8JnVCNhSlvftLaVYtrY-N2XvMC91GFr6vkTtWC6u8yhq3V6vedq4/exec", {
    method: "POST",
    body: JSON.stringify({ resposta: valor })
  });

  document.getElementById("tela-pergunta").classList.add("hidden");
  document.getElementById("tela-obrigado").classList.remove("hidden");

  setTimeout(() => {
    document.getElementById("tela-pergunta").classList.remove("hidden");
    document.getElementById("tela-obrigado").classList.add("hidden");
  }, 3000);
}
</script>

</body>
</html>
