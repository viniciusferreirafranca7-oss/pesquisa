<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pesquisa</title>

<style>

/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* GARANTE TELA CHEIA */
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial;
}

/* FUNDO PERFEITO */
body {
  background: url("fundo.png") no-repeat center center fixed;
  background-size: cover;

  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
}

/* CAMADA ESCURA */
.overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.6);
  z-index: 1;
}

/* CONTAINER CENTRAL */
.container {
  position: relative;
  z-index: 2;
  text-align: center;
  width: 100%;
  max-width: 600px;
  padding: 20px;
}

/* TEXTO */
h1 {
  font-size: 30px;
  margin-bottom: 40px;
}

/* BOTÕES */
.btn {
  padding: 20px;
  margin: 10px;
  font-size: 18px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  width: 100%;
  max-width: 300px;
  transition: 0.2s;
}

.sim { background: #00c853; }
.nao { background: #d50000; }

.btn:active {
  transform: scale(0.95);
}

/* ESCONDER */
.hidden {
  display: none;
}

</style>
</head>

<body>

<div class="overlay"></div>

<div class="container">

  <div id="tela-pergunta">
    <h1>Você gostaria dessa experiência no seu atendimento?</h1>

    <button class="btn sim" onclick="responder('Sim')">
      Quero essa experiência
    </button>

    <button class="btn nao" onclick="responder('Não')">
      Prefiro como está
    </button>
  </div>

  <div id="tela-obrigado" class="hidden">
    <h1>Obrigado pela sua resposta 🙌</h1>
  </div>

</div>

<script>
function responder(valor) {

  fetch("https://script.google.com/macros/s/AKfycbzv3pRzGk9iWGCZ8JnVCNhSlvftLaVYtrY-N2XvMC91GFr6vkTtWC6u8yhq3V6vedq4/exec", {
    method: "POST",
    body: JSON.stringify({ resposta: valor })
  });

  document.getElementById("tela-pergunta").classList.add("hidden");
  document.getElementById("tela-obrigado").classList.remove("hidden");

  setTimeout(() => {
    document.getElementById("tela-pergunta").classList.remove("hidden");
    document.getElementById("tela-obrigado").classList.add("hidden");
  }, 3000);
}
</script>

</body>
</html>
