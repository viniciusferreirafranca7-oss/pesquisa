<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tela experiência premium</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      overflow:hidden;
      width:100vw;
      height:100vh;
      position:relative;
      background:black;
    }

    /* VIDEO */

    #bg-video{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      object-fit:cover;
      z-index:-2;
    }

    /* OVERLAY */

    .overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.30);
      z-index:-1;
    }

    /* CONTEÚDO */

    .content{
      position:absolute;
      right:70px;
      bottom:90px;
      text-align:center;
      color:white;
      max-width:500px;
    }

    .content h1{
      font-size:48px;
      line-height:1.2;
      margin-bottom:30px;
      text-shadow:0 4px 12px rgba(0,0,0,0.5);
    }

    .buttons{
      display:flex;
      justify-content:center;
      gap:20px;
    }

    button{
      border:none;
      padding:18px 34px;
      font-size:24px;
      border-radius:14px;
      cursor:pointer;
      transition:0.2s ease;
      font-weight:bold;
    }

    button:hover{
      transform:scale(1.05);
    }

    button:active{
      transform:scale(0.96);
    }

    .yes{
      background:#2ecc71;
      color:white;
    }

    .no{
      background:#e74c3c;
      color:white;
    }

    /* MOBILE */

    @media(max-width:768px){

      .content{
        left:20px;
        right:20px;
        bottom:60px;
      }

      .content h1{
        font-size:34px;
      }

      button{
        font-size:20px;
        padding:16px 24px;
      }

    }

  </style>
</head>

<body>

  <!-- VIDEO -->

  <video autoplay muted loop playsinline preload="auto" id="bg-video">
    <source src="massagem.mp4" type="video/mp4">
  </video>

  <!-- OVERLAY -->

  <div class="overlay"></div>

  <!-- TEXTO -->

  <div class="content">

    <h1>
      Você pagaria a mais por essa experiência no salão?
    </h1>

    <div class="buttons">

      <button class="yes" onclick="vote('Sim')">
        👍 Sim
      </button>

      <button class="no" onclick="vote('Não')">
        👎 Não
      </button>

    </div>

  </div>

  <!-- SCRIPT -->

  <script>

    async function vote(resposta){

      try{

        await fetch("COLE_SEU_LINK_DO_GOOGLE_SCRIPT_AQUI", {

          method: "POST",

          body: JSON.stringify({
            resposta: resposta
          })

        });

        alert("Resposta enviada com sucesso!");

      }catch(erro){

        alert("Erro ao enviar resposta.");

        console.log(erro);

      }

    }

  </script>

</body>
</html>
