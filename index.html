<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tela experiência premium</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      position: relative;
      color: white;
    }

    /* Vídeo de fundo */
    #bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
    }

    /* Overlay escuro premium */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: -1;
    }

    /* Conteúdo */
    .content {
      position: absolute;
      right: 80px;
      bottom: 100px;
      text-align: center;
      max-width: 500px;
    }

    .content h1 {
      font-size: 42px;
      line-height: 1.2;
      margin-bottom: 30px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    .buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
    }

    button {
      border: none;
      padding: 18px 35px;
      font-size: 22px;
      border-radius: 14px;
      cursor: pointer;
      transition: 0.3s ease;
      font-weight: bold;
    }

    .yes {
      background: #2ecc71;
      color: white;
    }

    .no {
      background: #e74c3c;
      color: white;
    }

    button:hover {
      transform: scale(1.05);
    }

    /* Mobile */
    @media (max-width: 768px) {
      .content {
        right: 20px;
        left: 20px;
        bottom: 60px;
      }

      .content h1 {
        font-size: 30px;
      }

      button {
        font-size: 18px;
        padding: 14px 24px;
      }
    }
  </style>
</head>

<body>

  <!-- Vídeo -->
  <video autoplay muted loop playsinline id="bg-video">
    <source src="massagem.mp4" type="video/mp4">
  </video>

  <!-- Escurecimento -->
  <div class="overlay"></div>

  <!-- Texto -->
  <div class="content">
    <h1>Você pagaria a mais por essa experiência no salão?</h1>

    <div class="buttons">
      <button class="yes">👍 Sim</button>
      <button class="no">👎 Não</button>
    </div>
  </div>

</body>
</html>
